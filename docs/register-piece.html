<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲の登録 - 雅楽譜閲覧支援サイト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f1f5f9; color: #1e293b; margin: 0; padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .note { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: white; border-radius: 10px; padding: 16px 20px; max-width: 640px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: #334155; }
  label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
  select, input[type=text], input[type=number], input[type=email], input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
    font-size: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    background: #2563eb; color: white; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .viewer-img-wrap {
    background: #0f172a; border-radius: 8px; padding: 10px; text-align: center;
    margin-bottom: 10px; min-height: 260px; display: flex; align-items: center; justify-content: center;
  }
  .viewer-img-wrap img { max-width: 100%; max-height: 60vh; cursor: zoom-in; }
  .viewer-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .viewer-controls input[type=number] { width: 90px; margin-bottom: 0; }
  .page-label { font-size: 14px; font-weight: 600; color: #334155; min-width: 140px; }
  .field-btn { display: flex; gap: 6px; }
  .field-btn input { flex: 1; }
  .field-btn button { white-space: nowrap; padding: 8px 10px; font-size: 12px; }
  .status { font-size: 13px; margin-top: 8px; }
  .status.error { color: #dc2626; }
  .status.success { color: #16a34a; }
  a.back-link { font-size: 13px; color: #2563eb; }
  #gate { max-width: 360px; }
  .required-mark { color: #dc2626; font-weight: 700; }
  .optional-hint { color: #94a3b8; font-weight: 400; font-size: 12px; }
</style>
</head>
<body>

<p><a href="index.html" class="back-link">← 楽曲検索に戻る</a></p>
<h1>🎼 曲の登録</h1>
<p class="note">
  巻のページを見ながら曲の区切り・曲名・調を登録します。登録された内容は管理者の確認後に検索へ反映されます。
</p>

<div id="gate" class="panel">
  <h2>ログイン</h2>
  <label>メールアドレス</label>
  <input type="email" id="email" autocomplete="email">
  <label>パスワード</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="loginBtn">ログイン</button>
  <div class="status" id="gateStatus"></div>
</div>

<div id="app" style="display:none;">
  <div class="panel">
    <h2>1. 巻を選ぶ</h2>
    <div class="row">
      <div>
        <label>所蔵</label>
        <select id="collectionSelect"></select>
      </div>
      <div>
        <label>巻</label>
        <select id="volumeSelect"><option>先に所蔵を選んでください</option></select>
      </div>
    </div>
    <div class="status" id="volumeStatus"></div>
  </div>

  <div class="panel">
    <h2>2. ページを見る</h2>
    <div class="viewer-img-wrap" id="imgWrap">
      <span style="color:#94a3b8;">巻を選択するとページが表示されます</span>
    </div>
    <div class="viewer-controls">
      <button id="prevBtn" disabled>◀ 前のページ</button>
      <span class="page-label" id="pageLabel">-</span>
      <button id="nextBtn" disabled>次のページ ▶</button>
      <span style="flex:1"></span>
      <label style="margin:0; display:flex; align-items:center; gap:6px; font-weight:normal;">
        ページ番号へ移動
        <input type="number" id="jumpInput" disabled>
      </label>
      <button id="jumpBtn" class="secondary" disabled>移動</button>
    </div>
  </div>

  <div class="panel">
    <h2>3. 曲の情報を入力して登録</h2>
    <div class="row">
      <div>
        <label>楽器 <span class="required-mark">*</span></label>
        <input type="text" id="instrumentInput" placeholder="例: 琵琶" required>
      </div>
      <div>
        <label>調（分類がなければ「なし」のまま）</label>
        <select id="modeSelect">
          <option value="">なし</option>
          <option>壱越調</option>
          <option>平調</option>
          <option>双調</option>
          <option>黄鐘調</option>
          <option>盤渉調</option>
          <option>太食調</option>
        </select>
      </div>
    </div>
    <label>曲名 <span class="required-mark">*</span></label>
    <input type="text" id="pieceNameInput" placeholder="例: 越殿楽" required>
    <label>撰定年 <span class="optional-hint">（わかる場合は入力してください）</span></label>
    <input type="text" id="yearInput" list="yearSuggestions" placeholder="例: 明治9年撰定">
    <datalist id="yearSuggestions">
      <option value="明治9年撰定"></option>
      <option value="明治21年撰定"></option>
    </datalist>
    <div class="row">
      <div>
        <label>開始ページ <span class="required-mark">*</span></label>
        <div class="field-btn">
          <input type="number" id="startPageInput" required>
          <button type="button" class="secondary" id="setStartBtn">現在のページ</button>
        </div>
      </div>
      <div>
        <label>終了ページ <span class="required-mark">*</span></label>
        <div class="field-btn">
          <input type="number" id="endPageInput" required>
          <button type="button" class="secondary" id="setEndBtn">現在のページ</button>
        </div>
      </div>
    </div>
    <p class="note" style="margin: -4px 0 12px;"><span class="required-mark">*</span> は入力必須の項目です</p>
    <button id="submitBtn" disabled>この曲を登録する</button>
    <div class="status" id="submitStatus"></div>
  </div>

  <div class="panel" id="noPermissionPanel" style="display:none;">
    <h2>権限がありません</h2>
    <p class="note">このアカウントには曲の登録権限が設定されていません。管理者にお問い合わせください。</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://fenpzciyuwymcejsinul.supabase.co";
const SUPABASE_KEY = "sb_publishable_VCkn0BtvJ1x4aThgurDYmQ_E0ybr4Lt";
const IIIF_BASE = "https://mai0108.github.io/gagakufu_iiif_manifest";

const COLLECTIONS = {
  "100270332": { name: "宮内庁書陵部所蔵版" },
  "100376839": { name: "東京藝術大学所蔵版" },
};

const INSTRUMENT_GUESS_RULES = [
  [/鳳笙/, "笙"],
  [/篳篥/, "篳篥"],
  [/笛/, "龍笛"],
  [/琵琶/, "琵琶"],
  [/筝/, "筝"],
  [/和琴/, "和琴"],
  [/鞨皷|太皷|鉦皷|皷/, "鼓"],
];
function guessInstrument(label) {
  for (const [pattern, name] of INSTRUMENT_GUESS_RULES) {
    if (pattern.test(label)) return name;
  }
  return "";
}

let client = null;
let currentUser = null;
let currentSeriesId = null;
let currentVolume = null;
let currentVolumeLabel = "";
let pageIndex = 0;

function $(id) { return document.getElementById(id); }

function jpAuthError(err) {
  const msg = (err && err.message) || "";
  if (/Invalid login credentials/i.test(msg)) return "メールアドレスまたはパスワードが正しくありません。";
  if (/Email not confirmed/i.test(msg)) return "メールアドレスが未確認です。";
  return "エラーが発生しました: " + msg;
}

async function init() {
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  $("loginBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) {
      $("gateStatus").textContent = "メールアドレスとパスワードを入力してください。";
      $("gateStatus").className = "status error";
      return;
    }
    $("gateStatus").textContent = "ログイン中...";
    $("gateStatus").className = "status";
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      $("gateStatus").textContent = jpAuthError(error);
      $("gateStatus").className = "status error";
    }
  });

  const { data } = await client.auth.getSession();
  await handleSession(data.session);

  client.auth.onAuthStateChange((_event, session) => {
    handleSession(session);
  });
}

async function handleSession(session) {
  if (!session || !session.user) {
    currentUser = null;
    $("gate").style.display = "block";
    $("app").style.display = "none";
    return;
  }
  currentUser = session.user;

  const { data: contributorRow } = await client
    .from("contributors")
    .select("role")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  $("gate").style.display = "none";
  $("app").style.display = "block";

  if (!contributorRow) {
    $("noPermissionPanel").style.display = "block";
    document.querySelectorAll("#app > .panel:not(#noPermissionPanel)").forEach((el) => {
      el.style.display = "none";
    });
    return;
  }

  initCollectionSelect();
  currentSeriesId = $("collectionSelect").value;
  loadVolumeList(currentSeriesId);
}

function initCollectionSelect() {
  const sel = $("collectionSelect");
  if (sel.options.length > 0) return;
  Object.entries(COLLECTIONS).forEach(([id, info]) => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = `${info.name}（${id}）`;
    sel.appendChild(opt);
  });
}

async function loadVolumeList(seriesId) {
  const volumeSelect = $("volumeSelect");
  const volumeStatus = $("volumeStatus");
  volumeSelect.innerHTML = "<option>読み込み中...</option>";
  volumeStatus.textContent = "";
  try {
    const res = await fetch(`${IIIF_BASE}/${seriesId}/manifest-index.json`, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    volumeSelect.innerHTML = "";
    data.manifests.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m["@id"];
      opt.textContent = m.label;
      volumeSelect.appendChild(opt);
    });
    volumeSelect.disabled = false;
    await loadVolume(volumeSelect.value);
  } catch (err) {
    volumeStatus.textContent = "巻一覧の読み込みに失敗しました: " + err.message;
    volumeStatus.className = "status error";
  }
}

async function loadVolume(manifestUrl) {
  const volumeStatus = $("volumeStatus");
  volumeStatus.textContent = "読み込み中...";
  volumeStatus.className = "status";
  try {
    const res = await fetch(manifestUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const manifest = await res.json();
    currentVolume = manifest;
    currentVolumeLabel = $("volumeSelect").options[$("volumeSelect").selectedIndex].textContent;
    pageIndex = 0;

    const guessed = guessInstrument(currentVolumeLabel);
    if (guessed) $("instrumentInput").value = guessed;

    $("prevBtn").disabled = false;
    $("nextBtn").disabled = false;
    $("jumpInput").disabled = false;
    $("jumpBtn").disabled = false;
    $("submitBtn").disabled = false;

    renderPage();
    volumeStatus.textContent = `${manifest.sequences[0].canvases.length} ページを読み込みました`;
    volumeStatus.className = "status success";
  } catch (err) {
    volumeStatus.textContent = "巻の読み込みに失敗しました: " + err.message;
    volumeStatus.className = "status error";
  }
}

function getCanvases() {
  return (currentVolume && currentVolume.sequences[0].canvases) || [];
}

function renderPage() {
  const canvases = getCanvases();
  if (canvases.length === 0) return;
  const canvas = canvases[pageIndex];
  const service = canvas.images[0].resource.service["@id"];
  const displayUrl = `${service}/full/,1200/0/default.jpg`;
  const fullUrl = canvas.images[0].resource["@id"];

  $("imgWrap").innerHTML = `<img src="${displayUrl}" alt="ページ ${canvas.label}" onclick="window.open('${fullUrl}', '_blank')">`;
  $("pageLabel").textContent = `ページ ${canvas.label}（${pageIndex + 1} / ${canvases.length}）`;
  $("jumpInput").value = canvas.label;
}

function findIndexByLabel(label) {
  return getCanvases().findIndex((c) => String(c.label) === String(label));
}

function wireStaticEvents() {
  $("prevBtn").addEventListener("click", () => {
    if (pageIndex > 0) { pageIndex--; renderPage(); }
  });
  $("nextBtn").addEventListener("click", () => {
    if (pageIndex < getCanvases().length - 1) { pageIndex++; renderPage(); }
  });
  $("jumpBtn").addEventListener("click", () => {
    const idx = findIndexByLabel($("jumpInput").value.trim());
    if (idx === -1) {
      $("volumeStatus").textContent = `ページ ${$("jumpInput").value} は見つかりませんでした`;
      $("volumeStatus").className = "status error";
      return;
    }
    pageIndex = idx;
    renderPage();
  });
  $("setStartBtn").addEventListener("click", () => {
    $("startPageInput").value = getCanvases()[pageIndex].label;
  });
  $("setEndBtn").addEventListener("click", () => {
    $("endPageInput").value = getCanvases()[pageIndex].label;
  });
  $("collectionSelect").addEventListener("change", () => {
    currentSeriesId = $("collectionSelect").value;
    loadVolumeList(currentSeriesId);
  });
  $("volumeSelect").addEventListener("change", () => {
    loadVolume($("volumeSelect").value);
  });

  $("submitBtn").addEventListener("click", submitPiece);
}

async function submitPiece() {
  const submitStatus = $("submitStatus");
  submitStatus.textContent = "";
  submitStatus.className = "status";

  const instrument = $("instrumentInput").value.trim();
  const mode = $("modeSelect").value;
  const pieceName = $("pieceNameInput").value.trim();
  const year = $("yearInput").value.trim();
  const start = $("startPageInput").value.trim();
  const end = $("endPageInput").value.trim();

  if (!instrument || !pieceName || !start || !end) {
    submitStatus.textContent = "楽器・曲名・開始ページ・終了ページは必須です";
    submitStatus.className = "status error";
    return;
  }
  if (parseInt(start, 10) > parseInt(end, 10)) {
    submitStatus.textContent = "開始ページが終了ページより後になっています";
    submitStatus.className = "status error";
    return;
  }
  const startIdx = findIndexByLabel(start);
  const endIdx = findIndexByLabel(end);
  if (startIdx === -1 || endIdx === -1 || startIdx > endIdx) {
    submitStatus.textContent = "指定したページ範囲がこの巻の中に見つかりません";
    submitStatus.className = "status error";
    return;
  }

  $("submitBtn").disabled = true;
  submitStatus.textContent = "登録中...";

  const { error } = await client.from("piece_submissions").insert({
    submitted_by: currentUser.id,
    series_id: currentSeriesId,
    volume_manifest_url: $("volumeSelect").value,
    volume_label: currentVolumeLabel,
    instrument: instrument,
    mode: mode || null,
    piece_name: pieceName,
    compilation_year: year || null,
    start_page: start,
    end_page: end,
  });

  $("submitBtn").disabled = false;

  if (error) {
    submitStatus.textContent = "登録に失敗しました: " + error.message;
    submitStatus.className = "status error";
    return;
  }

  submitStatus.textContent = `登録しました（承認待ち）: ${pieceName}`;
  submitStatus.className = "status success";
  $("pieceNameInput").value = "";
  $("modeSelect").value = "";
  $("startPageInput").value = "";
  $("endPageInput").value = "";
}

wireStaticEvents();
document.addEventListener("DOMContentLoaded", () => {
  if (window.supabase) init();
  else window.addEventListener("load", init);
});
</script>
</body>
</html>
